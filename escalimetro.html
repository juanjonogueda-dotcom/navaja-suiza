<!DOCTYPE html>

<noscript><link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"></noscript>
<style>
  :root {
    --bg:           #000000;
    --surface:      #0d0d0d;
    --border:       rgba(255,255,255,0.55);
    --border-soft:  rgba(255,255,255,0.22);
    --border-hover: #ffffff;
    --text:         #ffffff;
    --text-mid:     rgba(255,255,255,0.88);
    --text-muted:   rgba(255,255,255,0.75);
    --text-faint:   rgba(255,255,255,0.45);
    --accent:       #ffffff;
    --clr-real:     #8effc1;
    --clr-plano:    #8fd0ff;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: clamp(20px, 2.5vh, 36px) clamp(20px, 4vw, 56px) 80px;
  }

  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(24px, 6vh, 64px) 0;
  }

  header {
    display: flex;
    align-items: baseline;
    gap: 16px;
    padding-bottom: clamp(14px, 1.8vh, 22px);
    border-bottom: 1px solid var(--border);
    margin-bottom: clamp(28px, 5vh, 56px);
  }

  .back-link {
    font-size: clamp(36px, 5vw, 64px);
    font-weight: 400;
    color: var(--text-muted);
    text-decoration: none;
    letter-spacing: -0.04em;
    line-height: 0.9;
    transition: color 0.15s;
  }
  .back-link:hover { color: var(--text); }

  h1 {
    font-size: clamp(36px, 5vw, 64px);
    font-weight: 400;
    letter-spacing: -0.04em;
    line-height: 0.9;
  }

  /* Cards */
  .cards-wrap {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-start;
    gap: clamp(28px, 5vw, 64px);
    max-width: 1200px;
    margin: 0 auto;
  }

  .card {
    position: relative;
    width: 380px;
    max-width: 100%;
  }

  .card-remove {
    position: absolute;
    top: -10px;
    right: -10px;
    background: var(--bg);
    border: 1px solid var(--border-soft);
    color: var(--text-faint);
    width: 24px;
    height: 24px;
    border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    transition: color 0.15s, border-color 0.15s;
    z-index: 1;
  }
  .card-remove.show { display: flex; }
  .card-remove:hover { color: var(--text); border-color: var(--border); }

  .scale-table {
    width: 100%;
    table-layout: fixed;
    border-collapse: collapse;
    border: 1px solid var(--border);
  }
  .scale-table tr { border-bottom: 1px solid var(--border); }
  .scale-table tr:last-child { border-bottom: none; }
  .scale-table td {
    padding: 12px 14px;
    vertical-align: middle;
    overflow: hidden;
  }
  .scale-table .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    width: 38%;
    border-right: 1px solid var(--border);
  }
  .row-real .label { color: var(--clr-real); }
  .row-plano .label { color: var(--clr-plano); }

  .cell { display: flex; align-items: center; gap: 8px; }

  .ratio-prefix {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1rem;
    color: var(--text-mid);
    flex-shrink: 0;
  }

  .num-input {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1rem;
    color: var(--text);
    background: transparent;
    border: none;
    outline: none;
    flex: 1 1 0;
    min-width: 0;
    padding: 2px 0;
    -moz-appearance: textfield;
    font-feature-settings: 'tnum' 1;
  }
  .num-input::-webkit-inner-spin-button,
  .num-input::-webkit-outer-spin-button { display: none; }
  .num-input.driven { color: var(--text-faint); }

  .scale-input { flex: 0 1 100px; }

  .unit-select {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    color: var(--text-mid);
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: 4px;
    padding: 5px 4px;
    outline: none;
    cursor: pointer;
    flex-shrink: 0;
  }
  .unit-select:hover, .unit-select:focus { border-color: var(--border); }

  .add-card {
    width: 340px;
    max-width: 100%;
    min-height: 148px;
    border: 1px dashed var(--border-soft);
    border-radius: 4px;
    background: none;
    color: var(--text-faint);
    font-family: 'JetBrains Mono', monospace;
    font-size: 2rem;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
    align-self: stretch;
  }
  .add-card:hover { color: var(--text); border-color: var(--border); }

  @media (max-width: 500px) {
    .cards-wrap { gap: 44px; }
    .card, .add-card { width: 100%; }
    .scale-table .label { width: 34%; }
    .scale-table td { padding: 10px 10px; }
    .unit-select { font-size: 0.66rem; padding: 5px 3px; }
  }
</style>
</head>
<body>
<div class="page">

  <header>
    <a class="back-link" href="index.html">←</a>
    <h1>Escalímetro</h1>
  </header>

  <main>
    <div class="cards-wrap" id="cardsWrap"></div>
  </main>

</div>

<template id="cardTemplate">
  <div class="card">
    <button class="card-remove" aria-label="Eliminar tabla" data-action="remove">×</button>
    <table class="scale-table">
      <tr>
        <td class="label">Relación de escala</td>
        <td class="cell">
          <span class="ratio-prefix">1&nbsp;:</span>
          <input type="number" class="num-input scale-input" data-role="scale" value="100" step="any" placeholder="0" aria-label="Factor de escala">
        </td>
      </tr>
      <tr class="row-real">
        <td class="label">Longitud real</td>
        <td class="cell">
          <input type="number" class="num-input" data-role="real" value="1" step="any" placeholder="0" aria-label="Longitud real">
          <select class="unit-select" data-role="realUnit" aria-label="Unidad de longitud real">
            <option value="km">kilómetros</option>
            <option value="m" selected>metros</option>
            <option value="cm">centímetros</option>
            <option value="mm">milímetros</option>
            <option value="in">pulgadas</option>
          </select>
        </td>
      </tr>
      <tr class="row-plano">
        <td class="label">Longitud de escala</td>
        <td class="cell">
          <input type="number" class="num-input" data-role="plano" value="" step="any" placeholder="0" aria-label="Longitud de escala">
          <select class="unit-select" data-role="planoUnit" aria-label="Unidad de longitud de escala">
            <option value="km">kilómetros</option>
            <option value="m">metros</option>
            <option value="cm">centímetros</option>
            <option value="mm" selected>milímetros</option>
            <option value="in">pulgadas</option>
          </select>
        </td>
      </tr>
    </table>
  </div>
</template>

<script>
  const toM   = { km:1000, m:1, cm:0.01, mm:0.001, in:0.0254 };
  const fromM = { km:0.001, m:1, cm:100, mm:1000, in:39.3701 };
  const STORAGE_KEY = 'escalimetro_cards_v2';

  const wrap     = document.getElementById('cardsWrap');
  const template = document.getElementById('cardTemplate');

  function formatResult(val) {
    if (!isFinite(val)) return '';
    return val.toFixed(4);
  }

  function createCard(state) {
    const node = template.content.firstElementChild.cloneNode(true);
    const scaleEl  = node.querySelector('[data-role="scale"]');
    const realEl   = node.querySelector('[data-role="real"]');
    const planoEl  = node.querySelector('[data-role="plano"]');
    const realUnitEl  = node.querySelector('[data-role="realUnit"]');
    const planoUnitEl = node.querySelector('[data-role="planoUnit"]');
    const removeBtn   = node.querySelector('[data-action="remove"]');

    let lastEdited = (state && state.lastEdited) || 'real';

    if (state) {
      if (state.scale != null) scaleEl.value = state.scale;
      if (state.realUnit) realUnitEl.value = state.realUnit;
      if (state.planoUnit) planoUnitEl.value = state.planoUnit;
      if (state.real != null) realEl.value = state.real;
      if (state.plano != null) planoEl.value = state.plano;
    }

    function calc() {
      const s = parseFloat(scaleEl.value) || 1;
      realEl.classList.toggle('driven',  lastEdited !== 'real');
      planoEl.classList.toggle('driven', lastEdited !== 'plano');

      if (lastEdited === 'real') {
        const v = parseFloat(realEl.value);
        if (isNaN(v) || v < 0 || s <= 0) { planoEl.value = ''; persist(); return; }
        const planoVal = (v * toM[realUnitEl.value] / s) * fromM[planoUnitEl.value];
        planoEl.value = formatResult(planoVal);
      } else {
        const v = parseFloat(planoEl.value);
        if (isNaN(v) || v < 0 || s <= 0) { realEl.value = ''; persist(); return; }
        const realVal = (v * toM[planoUnitEl.value] * s) * fromM[realUnitEl.value];
        realEl.value = formatResult(realVal);
      }
      persist();
    }

    scaleEl.addEventListener('input', calc);
    realUnitEl.addEventListener('change', calc);
    planoUnitEl.addEventListener('change', calc);
    realEl.addEventListener('input',  () => { lastEdited = 'real';  calc(); });
    planoEl.addEventListener('input', () => { lastEdited = 'plano'; calc(); });
    removeBtn.addEventListener('click', () => {
      node.remove();
      updateRemoveVisibility();
      persist();
    });

    node._getState = () => ({
      scale: scaleEl.value,
      real: realEl.value,
      plano: planoEl.value,
      realUnit: realUnitEl.value,
      planoUnit: planoUnitEl.value,
      lastEdited
    });

    calc();
    return node;
  }

  function updateRemoveVisibility() {
    const cards = wrap.querySelectorAll('.card');
    cards.forEach(c => c.querySelector('.card-remove').classList.toggle('show', cards.length > 1));
  }

  let persistTimer = null;
  function persist() {
    clearTimeout(persistTimer);
    persistTimer = setTimeout(() => {
      try {
        const cards = Array.from(wrap.querySelectorAll('.card')).map(c => c._getState());
        localStorage.setItem(STORAGE_KEY, JSON.stringify(cards));
      } catch (e) {}
    }, 300);
  }

  function addCard(state) {
    const node = createCard(state);
    wrap.insertBefore(node, addBtn);
    updateRemoveVisibility();
    return node;
  }

  const addBtn = document.createElement('button');
  addBtn.className = 'add-card';
  addBtn.type = 'button';
  addBtn.textContent = '+';
  addBtn.setAttribute('aria-label', 'Agregar nueva tabla de escala');
  addBtn.addEventListener('click', () => { addCard(); persist(); });

  function init() {
    wrap.appendChild(addBtn);

    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch (e) {}

    if (Array.isArray(saved) && saved.length) {
      saved.forEach(s => addCard(s));
    } else {
      addCard();
    }
  }

  init();
</script>
</body>
</html>
</content>
